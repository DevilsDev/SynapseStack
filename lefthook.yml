# ----------------------------------------------
# File: lefthook.yml
# Description: Git hook definitions with commit message linting enforced pre-push.
# Version: 0.3.0
# Author: Ali Kahwaji
# ----------------------------------------------

hooks:
  pre-commit:
    parallel: true
    commands:
      lint:
        run: npm run lint
      prettier:
        run: npx prettier --check .

  commit-msg:
    scripts:
      commitlint:
        runner: npx commitlint --edit $1

  pre-push:
    commands:
      lint-strict:
        run: npm run lint:strict
      test:
        run: npm run test
      commitlint:
        run: git log -1 --pretty=%B | npx commitlint
