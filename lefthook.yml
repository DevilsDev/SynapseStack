# ----------------------------------------------
# File: lefthook.yml
# Description: Git hook configuration with pre-commit security enforcement.
# Version: 0.4.1
# Author: Ali Kahwaji
# ----------------------------------------------

hooks:
  pre-commit:
    parallel: true
    commands:
      lint:
        run: npm run lint
      prettier:
        run: npx prettier --check .
      gitleaks:
        run: gitleaks detect --no-banner --report-format short --redact || exit 1
      dotenv-linter:
        run: npx dotenv-linter .env.example || exit 0

  commit-msg:
    scripts:
      commitlint:
        runner: npx commitlint --edit $1

  pre-push:
    commands:
      lint-strict:
        run: npm run lint:strict
      test:
        run: npm run test
      commitlint:
        run: git log -1 --pretty=%B | npx commitlint
