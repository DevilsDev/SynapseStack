# ----------------------------------------------
# File: .github/workflows/release.yml
# Description: Automates semantic release, changelog generation, and npm publish.
# Version: 0.1.0
# Author: Ali Kahwaji
# ----------------------------------------------

    name: Release

    on:
      push:
        branches: [main]
    
    jobs:
      release:
        runs-on: ubuntu-latest
        steps:
          - uses: actions/checkout@v3
    
          - name: Set up Node.js
            uses: actions/setup-node@v3
            with:
              node-version: '20'
    
          - name: Install dependencies
            run: npm ci
    
          - name: Release
            env:
              GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            run: npx semantic-release