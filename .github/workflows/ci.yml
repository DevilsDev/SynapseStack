# ----------------------------------------------
# File: .github/workflows/ci.yml
# Description: CI pipeline excluding commitlint; commit message validation is enforced via Lefthook.
# Version: 0.3.2
# Author: Ali Kahwaji
# ----------------------------------------------

  name: Continuous Integration

  on:
    push:
      branches: [main, develop]
    pull_request:
      branches: [main, develop]
  
  jobs:
    build-and-test:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v3
  
        - name: Set up Node.js
          uses: actions/setup-node@v3
          with:
            node-version: '20'
  
        - name: Install dependencies
          run: npm ci
  
        - name: Run ESLint
          run: npm run lint
  
        - name: Run Prettier Check
          run: npm run format -- --check
  
        - name: Type Check
          run: tsc --noEmit
  
        - name: Run Tests
          run: npm run test
  
        - name: Run Coverage
          run: npm run test:coverage
  
        - name: Enforce Branch Naming Convention
          run: |
            BRANCH_NAME="${GITHUB_HEAD_REF:-${GITHUB_REF##*/}}"
            if ! [[ "$BRANCH_NAME" =~ ^(phase|feature|bugfix|release|develop)/?$ ]]; then
              echo "Invalid branch name: $BRANCH_NAME"
              exit 1
            fi
  
        - name: Lint-Staged Check
          run: npx lint-staged
  