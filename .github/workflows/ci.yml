# ----------------------------------------------
# File: .github/workflows/ci.yml
# Description: Runs linting, type-checking, and unit tests on all PRs and pushes.
# Version: 0.1.0
# Author: Ali Kahwaji
# ----------------------------------------------

    name: Continuous Integration

    on:
      push:
        branches: [main, develop]
      pull_request:
        branches: [main, develop]
    
    jobs:
      build-and-test:
        runs-on: ubuntu-latest
        steps:
          - uses: actions/checkout@v3
    
          - name: Set up Node.js
            uses: actions/setup-node@v3
            with:
              node-version: '20'
    
          - name: Install dependencies
            run: npm ci
    
          - name: Lint
            run: npm run lint
    
          - name: Type check
            run: tsc --noEmit
    
          - name: Run tests
            run: npm test
    